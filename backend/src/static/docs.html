<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Customer Intelligence Platform — API Docs</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 0; background: #0a0a0a; color: #ededed; }
  header { padding: 24px 32px; border-bottom: 1px solid #262626; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  main { max-width: 920px; margin: 0 auto; padding: 24px 32px 80px; }
  .path { border: 1px solid #262626; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .path-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; background: #111; }
  .method { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .get { background: #14324a; color: #7cc4ff; }
  .post { background: #143a20; color: #7cffa0; }
  .route { font-family: ui-monospace, monospace; font-size: 14px; }
  .summary { color: #a1a1a1; font-size: 13px; margin-left: auto; }
  .body { padding: 0 16px 16px; display: none; }
  .path.open .body { display: block; }
  pre { background: #000; border: 1px solid #262626; border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
  .desc { color: #d4d4d4; font-size: 13.5px; line-height: 1.5; margin: 8px 0; }
  strong { display: block; margin-top: 10px; font-size: 12px; color: #a1a1a1; text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>
<body>
<header><h1>Customer Intelligence Platform &mdash; API Reference</h1></header>
<main id="app">Loading OpenAPI spec&hellip;</main>
<script>
const methodClass = { get: 'get', post: 'post' };

function el(tag, props, children) {
  const node = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'className') node.className = v;
    else if (k === 'textContent') node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const child of (children || [])) node.appendChild(child);
  return node;
}

function pre(obj) {
  return el('pre', { textContent: JSON.stringify(obj, null, 2) });
}

fetch('/api/openapi.json').then(r => r.json()).then(spec => {
  const app = document.getElementById('app');
  app.textContent = '';
  app.appendChild(el('p', { className: 'desc', textContent: spec.info.description || '' }));

  for (const [route, methods] of Object.entries(spec.paths)) {
    for (const [method, def] of Object.entries(methods)) {
      const bodyChildren = [];
      if (def.description) bodyChildren.push(el('p', { className: 'desc', textContent: def.description }));
      if (def.parameters && def.parameters.length) {
        bodyChildren.push(el('strong', { textContent: 'Parameters' }));
        bodyChildren.push(pre(def.parameters));
      }
      if (def.requestBody) {
        bodyChildren.push(el('strong', { textContent: 'Request body' }));
        bodyChildren.push(pre(def.requestBody));
      }
      bodyChildren.push(el('strong', { textContent: 'Responses' }));
      bodyChildren.push(pre(def.responses));

      const methodBadge = el('span', { className: `method ${methodClass[method] || ''}`, textContent: method.toUpperCase() });
      const routeLabel = el('span', { className: 'route', textContent: route });
      const summaryLabel = el('span', { className: 'summary', textContent: def.summary || '' });
      const head = el('div', { className: 'path-head' }, [methodBadge, routeLabel, summaryLabel]);
      const body = el('div', { className: 'body' }, bodyChildren);
      const wrapper = el('div', { className: 'path' }, [head, body]);
      head.addEventListener('click', () => wrapper.classList.toggle('open'));
      app.appendChild(wrapper);
    }
  }
}).catch(e => {
  document.getElementById('app').textContent = 'Failed to load spec: ' + e;
});
</script>
</body>
</html>
