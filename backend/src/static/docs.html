<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Intelligence API — Interactive Docs</title>
  <link rel="icon" type="image/png" href="/api/docs/assets/favicon.png" />
  <link rel="stylesheet" href="/api/docs/assets/swagger-ui.css" />
  <style>
    body { margin: 0; }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="/api/docs/assets/swagger-ui-bundle.js"></script>
  <script src="/api/docs/assets/swagger-ui-standalone-preset.js"></script>
  <script>
    // Bootstrap Swagger UI against our own OpenAPI spec, fully same-origin.
    // The spec is fetched as data and handed to SwaggerUIBundle as an object —
    // no URL parsing, no HTML building from response strings in this file.
    (async function () {
      try {
        const res = await fetch('/api/openapi.json')
        if (!res.ok) throw new Error('Failed to load spec: HTTP ' + res.status)
        const spec = await res.json()
        window.ui = SwaggerUIBundle({
          spec: spec,
          dom_id: '#swagger-ui',
          deepLinking: true,
          displayRequestDuration: true,
          tryItOutEnabled: true,
          persistAuthorization: false,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: 'StandaloneLayout',
        })
      } catch (err) {
        const host = document.getElementById('swagger-ui')
        const box = document.createElement('div')
        box.style.cssText = 'padding:3rem 2rem;font-family:monospace;max-width:46rem;margin:0 auto'
        const head = document.createElement('h1')
        head.textContent = 'Could not load the API specification'
        const body = document.createElement('p')
        body.textContent = String(err && err.message ? err.message : err)
        box.appendChild(head)
        box.appendChild(body)
        host.appendChild(box)
      }
    })()
  </script>
</body>
</html>
