# Temporary overrides applied ONLY during bulk COPY import.
# Applied via `ALTER SYSTEM` after the container starts, reverted (removed)
# immediately after import completes and before any traffic is served.
# Rationale: import is a single-shot, restart-safe operation (we can always
# re-import from the source dump), so durability can be traded for throughput.

fsync = off
synchronous_commit = off
full_page_writes = off
autovacuum = off
maintenance_work_mem = 1GB
max_wal_size = 16GB
checkpoint_timeout = 60min
