# Tuned for: DigitalOcean KVM droplet, 4 vCPU, 7.8GB RAM, SSD-backed block storage
# (fio randread 8k/iodepth16 ~3.5k IOPS, ~277us avg latency -> SSD, not spinning disk)
# Dataset: ~5.1GB uncompressed / 22.4M rows across 4 populated tables.
#
# Budget rationale: 2GB shared_buffers + ~1GB headroom for Rust API/Nginx/OS,
# remaining ~4.5GB free for OS page cache (holds most of the working set).
# work_mem kept modest because pool size is small (see DATABASE_NOTES.md) but
# multiple parallel workers can each allocate work_mem for a sort/hash node.

listen_addresses = '*'
max_connections = 60

# Memory
shared_buffers = 2GB
effective_cache_size = 5GB
maintenance_work_mem = 1GB
work_mem = 32MB
huge_pages = try

# WAL / checkpoints (durable production values; import uses a relaxed override)
wal_buffers = 64MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Planner - SSD-backed storage
random_page_cost = 1.1
effective_io_concurrency = 200
seq_page_cost = 1.0

# Parallelism - 4 vCPUs
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# JIT: default threshold (100000) already excludes point-lookup search queries;
# only the heavy quality/duplicate aggregates cross it. Left on, revisit if
# load-test p99 shows JIT compile-time variance.
jit = on

# Autovacuum - keep on; ws_user is read-mostly after import but stats must stay fresh
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 20s

# Logging (low overhead, no per-statement logging in hot path)
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 5s

# Misc
timezone = 'UTC'
statement_timeout = 8000
idle_in_transaction_session_timeout = 30000
