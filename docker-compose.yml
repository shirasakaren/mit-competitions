services:
  postgres:
    image: postgres:16-alpine
    container_name: cip-postgres
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-challenge_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgresql.tuned.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    ports:
      - "127.0.0.1:5432:5432"
    networks: [cip]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cip} -d ${POSTGRES_DB:-challenge_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cip-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cip}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-challenge_db}
      RUST_LOG: ${RUST_LOG:-info}
      DB_POOL_MIN: ${DB_POOL_MIN:-20}
      DB_POOL_MAX: ${DB_POOL_MAX:-56}
      HTTP_PORT: 8080
      TOTAL_RECORDS_COMPAT: "14999896"
      QUALITY_REFRESH_SECS: ${QUALITY_REFRESH_SECS:-1800}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cip]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cip-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 3000 is the port the challenge's own test flow expects
      # ("curl http://localhost:3000/api/health" after docker-compose up).
      - "3000:3000"
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [cip]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  cip:
    driver: bridge

volumes:
  pgdata:
    driver: local
